<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>LangApp — Panel</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand small">LangApp</span>
    <button id="logout" class="ghost">Wyloguj</button>
  </header>

  <main class="dashboard">
    <div class="dash-header">
      <h1>Witaj, <span id="user-login">…</span>!</h1>
      <button id="btn-add-language" class="primary">+ Dodaj język</button>
    </div>

    <h2 class="section-title">Moje języki</h2>
    <section id="my-languages" class="cards">
      <p class="empty">Nie masz jeszcze żadnego języka. Kliknij „+ Dodaj język".</p>
    </section>
  </main>

  <!-- Modal: wybór języka -->
  <div id="modal-lang" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Wybierz język</h2>
        <button id="modal-close" class="ghost">×</button>
      </div>
      <input type="text" id="lang-search" placeholder="Szukaj języka..." class="modal-search" />
      <ul id="lang-list" class="lang-list"></ul>
    </div>
  </div>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
