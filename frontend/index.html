<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LangApp — Nauka języków w Twojej sieci</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@thumbmarkjs/thumbmarkjs/dist/thumbmark.umd.js"></script>
</head>
<body>
  <main class="auth-wrapper">
    <section class="card">
      <h1 class="brand">LangApp</h1>
      <p class="subtitle">Ucz się języków w swojej lokalnej sieci</p>

      <div class="tabs">
        <button class="tab active" data-tab="login">Logowanie</button>
        <button class="tab" data-tab="register">Rejestracja</button>
      </div>

      <!-- LOGOWANIE -->
      <form id="login-form" class="form active" autocomplete="off"
            method="post" onsubmit="return false;">
        <label>Login
          <input type="text" name="login" required minlength="3" maxlength="64" />
        </label>
        <label>Hasło
          <input type="password" name="password" required minlength="6" />
        </label>
        <button type="submit" class="primary">Zaloguj się</button>
        <p class="msg" id="login-msg"></p>
      </form>

      <!-- REJESTRACJA -->
      <form id="register-form" class="form" autocomplete="off"
            method="post" onsubmit="return false;">
        <label>Login
          <input type="text" name="login" required minlength="3" maxlength="64"
                 pattern="[A-Za-z0-9_.\-]{3,64}" />
        </label>
        <label>Hasło
          <input type="password" name="password" id="reg-password" required minlength="6" />
        </label>

        <!-- Animowany wskaźnik kryteriów -->
        <ul class="criteria" id="criteria">
          <li data-crit="len"><span class="dot"></span> Minimum 6 znaków</li>
          <li data-crit="upper"><span class="dot"></span> Wielka litera</li>
          <li data-crit="digit"><span class="dot"></span> Cyfra</li>
          <li data-crit="special"><span class="dot"></span> Znak specjalny</li>
        </ul>

        <label>Powtórz hasło
          <input type="password" name="password_confirm" required minlength="6" />
        </label>

        <button type="submit" class="primary">Utwórz konto</button>
        <p class="msg" id="register-msg"></p>
      </form>
    </section>
  </main>

  <script type="module" src="/js/register.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
